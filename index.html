<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>北野天満宮 来訪カウンター</title>
<meta name="theme-color" content="#7a1f2b">
<style>
  :root {
    --ume: #b8325a; --ume-soft: #f8e6ec; --shu: #7a1f2b; --ink: #2b2622; --sub: #7a716a;
    --paper: #faf7f2; --card: #fff; --line: #e7e0d6; --gold: #b08a3e; --gold-soft: #f5ecd6;
    --ai: #2d4f7c; --ai-soft: #e4ecf6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .mincho { font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; }
  header {
    background: var(--shu); color: #fff; padding: calc(12px + env(safe-area-inset-top)) 18px 12px;
    display: flex; align-items: center; gap: 10px;
  }
  header svg { width: 30px; height: 30px; flex: none; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .12em; font-weight: 600; }
  header .date { margin-left: auto; font-size: 13px; opacity: .85; }

  /* live counter */
  .counter { padding: 14px; }
  .total { display: flex; align-items: baseline; justify-content: center; gap: 6px; margin: 0 0 10px; flex-wrap: wrap; }
  .total .num { font-size: 52px; font-weight: 700; color: var(--shu); line-height: 1; font-variant-numeric: tabular-nums; }
  .total .lbl { font-size: 14px; color: var(--sub); }
  .total .split { font-size: 13px; color: var(--sub); margin-left: 10px; }
  .grid { display: grid; grid-template-columns: 52px repeat(3, 1fr); gap: 8px; align-items: stretch; }
  .grid .rowlbl { display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; border-radius: 10px; text-align: center; }
  .grid .rowlbl.jp { background: var(--ume-soft); color: var(--shu); }
  .grid .rowlbl.fg { background: var(--ai-soft); color: var(--ai); }
  .colhead { text-align: center; font-size: 12px; color: var(--sub); }
  .cbtn {
    position: relative; border: none; border-radius: 14px; padding: 12px 4px 10px; cursor: pointer; font: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 92px; justify-content: center;
    transition: transform .06s ease, filter .15s, box-shadow .15s; user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  .cbtn:active { transform: scale(.96); }
  .cbtn .t { font-size: 13px; font-weight: 600; }
  .cbtn .c { font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .cbtn .p {
    position: absolute; top: -8px; right: -6px; min-width: 34px; padding: 3px 8px; border-radius: 99px;
    background: #fff; color: var(--ink); font-size: 16px; font-weight: 800; box-shadow: 0 2px 8px rgba(0,0,0,.25);
    display: none;
  }
  .cbtn.pending { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--gold); }
  .cbtn.pending .p { display: block; }
  .cbtn.jp { background: var(--ume); color: #fff; }
  .cbtn.jp.b2 { background: #9b2748; }
  .cbtn.jp.b3 { background: var(--shu); }
  .cbtn.fg { background: #3c6699; color: #fff; }
  .cbtn.fg.b2 { background: var(--ai); }
  .cbtn.fg.b3 { background: #1e3756; }
  .cbtn.flash { filter: brightness(1.35); }

  .send-row { display: flex; gap: 8px; margin-top: 14px; }
  .send-row .btn-ghost { flex: none; padding: 0 16px; }
  .btn-send {
    flex: 1; height: 60px; border: none; border-radius: 14px; background: var(--gold); color: #fff;
    font-size: 20px; font-weight: 700; letter-spacing: .15em; transition: background .2s, transform .06s;
  }
  .btn-send:active { transform: scale(.98); }
  .btn-send:disabled { background: #d9d2c7; color: #fff; cursor: default; letter-spacing: .05em; font-size: 15px; font-weight: 600; }
  .draft { min-height: 20px; font-size: 13px; color: var(--ink); margin-top: 8px; text-align: center; }
  .undo-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .undo-row .last { font-size: 13px; color: var(--sub); flex: 1; min-width: 0; }

  .sent {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
    background: rgba(250,247,242,.6); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
    pointer-events: none; opacity: 0; transition: opacity .2s;
  }
  .sent.show { opacity: 1; }
  .sent .box {
    background: var(--shu); color: #fff; border-radius: 22px; padding: 26px 40px; text-align: center;
    box-shadow: 0 20px 60px rgba(122,31,43,.35); transform: scale(.85); transition: transform .25s cubic-bezier(.2,1.4,.4,1);
  }
  .sent.show .box { transform: scale(1); }
  .sent .ck { width: 64px; height: 64px; border-radius: 50%; background: #fff; color: var(--shu); font-size: 40px; font-weight: 900; line-height: 64px; margin: 0 auto 10px; }
  .sent .h { font-size: 22px; font-weight: 700; letter-spacing: .1em; }
  .sent .s { font-size: 14px; opacity: .9; margin-top: 4px; }
  .sent .n { font-size: 13px; opacity: .8; margin-top: 10px; }

  main { max-width: 920px; margin: 0 auto; padding: 16px 14px 40px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 15px; margin: 0 0 12px; letter-spacing: .08em; color: var(--shu); display: flex; align-items: center; gap: 8px; }
  .card h2 .r { margin-left: auto; }
  .more { text-align: center; font-size: 11px; color: var(--sub); padding-top: 4px; flex: none; }

  button { font: inherit; cursor: pointer; }
  .btn { border: none; border-radius: 10px; padding: 12px 18px; font-size: 16px; }
  .btn-primary { background: var(--ume); color: #fff; font-weight: 600; letter-spacing: .1em; }
  .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); font-size: 14px; padding: 8px 12px; border-radius: 10px; }
  .btn-ghost:hover { background: var(--paper); }
  .btn-small { font-size: 13px; padding: 5px 10px; }
  .btn-danger { color: var(--ume); }

  /* summary table */
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
  .seg button { border: none; background: none; padding: 5px 12px; font-size: 13px; color: var(--sub); }
  .seg button.on { background: var(--shu); color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: left; }
  th { font-size: 12px; color: var(--sub); font-weight: 500; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  tr.sum td { font-weight: 700; border-top: 2px solid var(--line); }

  /* form */
  form.entry { display: grid; grid-template-columns: 1fr 120px auto auto; gap: 10px; align-items: end; }
  @media (max-width: 600px) { form.entry { grid-template-columns: 1fr 1fr; } form.entry .btn { grid-column: 1 / -1; } }
  label.f { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--sub); position: relative; }
  label.chk { display: flex; align-items: center; gap: 6px; font-size: 15px; padding: 10px 4px; white-space: nowrap; }
  label.chk input { width: 20px; height: 20px; accent-color: var(--ai); }
  input, select { font: inherit; font-size: 17px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); width: 100%; }
  input:focus, select:focus { outline: 2px solid var(--ume); outline-offset: -1px; border-color: transparent; }
  .suggest { position: absolute; top: 100%; left: 0; right: 0; z-index: 10; margin-top: 4px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.08); overflow: hidden; display: none; }
  .suggest.show { display: block; }
  .suggest div { padding: 10px 12px; cursor: pointer; display: flex; justify-content: space-between; font-size: 15px; color: var(--ink); }
  .suggest div:hover, .suggest div.active { background: var(--ume-soft); }
  .suggest small { color: var(--sub); }
  .note { font-size: 12px; color: var(--sub); margin-top: 8px; }
  .result { display: none; margin-top: 14px; border-radius: 12px; padding: 14px; background: linear-gradient(135deg, #fff 0%, var(--ume-soft) 100%); border: 1px solid #ecc6d3; text-align: center; }
  .result.show { display: block; animation: pop .35s ease; }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
  .result .who { font-size: 18px; }
  .result .nth { font-size: 38px; font-weight: 700; color: var(--shu); margin: 4px 0; }
  .result .nth.first { color: var(--gold); }
  .result .meta { font-size: 13px; color: var(--sub); }

  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--ume-soft); color: var(--shu); white-space: nowrap; }
  .badge.b1 { background: var(--gold-soft); color: #8a6620; }
  .badge.fg { background: var(--ai-soft); color: var(--ai); }

  /* tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tab { background: none; border: none; padding: 10px 12px; font-size: 15px; color: var(--sub); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tab.on { color: var(--shu); border-bottom-color: var(--shu); font-weight: 600; }
  .panel { display: none; }
  .panel.on { display: block; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .toolbar input, .toolbar select { font-size: 15px; padding: 8px 10px; width: auto; }
  .toolbar .grow { flex: 1; min-width: 160px; }
  .empty { text-align: center; color: var(--sub); padding: 24px; font-size: 14px; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: var(--paper); }
  .muted { color: var(--sub); }

  .bars { display: flex; align-items: flex-end; gap: 3px; height: 140px; padding-top: 8px; }
  .bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; justify-content: flex-end; min-width: 0; }
  .bars .col { width: 100%; max-width: 28px; display: flex; flex-direction: column-reverse; border-radius: 4px 4px 0 0; overflow: hidden; }
  .bars .d, .bars .v { font-size: 10px; color: var(--sub); }
  .bars .v { color: var(--ink); }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--sub); margin-top: 8px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

  dialog { border: none; border-radius: 14px; padding: 0; max-width: 480px; width: calc(100% - 32px); }
  dialog::backdrop { background: rgba(30,20,20,.4); }
  .dlg { padding: 20px; }
  .dlg h3 { margin: 0 0 4px; color: var(--shu); }
  .dlg .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .dlg ul { list-style: none; padding: 0; margin: 12px 0 0; max-height: 240px; overflow: auto; }
  .dlg li { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; display: flex; justify-content: space-between; }
  footer { text-align: center; font-size: 12px; color: var(--sub); padding: 10px 16px 30px; }
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 40 40" aria-hidden="true">
    <g fill="#fff"><circle cx="20" cy="9" r="7"/><circle cx="30.5" cy="16.6" r="7"/><circle cx="26.5" cy="29" r="7"/><circle cx="13.5" cy="29" r="7"/><circle cx="9.5" cy="16.6" r="7"/></g>
    <circle cx="20" cy="20" r="4.2" fill="#7a1f2b"/>
  </svg>
  <h1 class="mincho">北野天満宮 来訪カウンター</h1>
  <span class="date" id="todayLabel"></span>
</header>

<main>
  <!-- live counter -->
  <section class="card counter">
    <h2 class="mincho">ライブカウント（本日）<span class="r" id="groupLabel" style="font-size:12px;color:var(--sub);letter-spacing:0"></span></h2>
    <div class="total">
      <span class="lbl">本日</span><span class="num" id="tTotal">0</span><span class="lbl">名</span>
      <span class="split" id="tSplit"></span>
    </div>
    <div class="grid">
      <div></div>
      <div class="colhead">1回目</div><div class="colhead">2回目</div><div class="colhead">3回目以上</div>
      <div class="rowlbl jp">日本人</div>
      <button class="cbtn jp b1" data-f="0" data-b="1"><span class="t">1回目</span><span class="c">0</span><span class="p"></span></button>
      <button class="cbtn jp b2" data-f="0" data-b="2"><span class="t">2回目</span><span class="c">0</span><span class="p"></span></button>
      <button class="cbtn jp b3" data-f="0" data-b="3"><span class="t">3回目以上</span><span class="c">0</span><span class="p"></span></button>
      <div class="rowlbl fg">外国人</div>
      <button class="cbtn fg b1" data-f="1" data-b="1"><span class="t">1回目</span><span class="c">0</span><span class="p"></span></button>
      <button class="cbtn fg b2" data-f="1" data-b="2"><span class="t">2回目</span><span class="c">0</span><span class="p"></span></button>
      <button class="cbtn fg b3" data-f="1" data-b="3"><span class="t">3回目以上</span><span class="c">0</span><span class="p"></span></button>
    </div>
    <div class="draft" id="draftLabel"></div>
    <div class="send-row">
      <button class="btn-ghost" id="clearBtn">クリア</button>
      <button class="btn-send" id="sendBtn" disabled>区分をタップしてください</button>
    </div>
    <div class="undo-row">
      <span class="last" id="lastLabel"></span>
    </div>
  </section>

  <!-- summary -->
  <section class="card">
    <h2 class="mincho">集計 <span class="r seg" id="sumSeg"><button data-v="today" class="on">本日</button><button data-v="month">今月</button><button data-v="all">累計</button></span></h2>
    <table>
      <thead><tr><th></th><th class="n">1回目</th><th class="n">2回目</th><th class="n">3回目以上</th><th class="n">計</th></tr></thead>
      <tbody id="sumBody"></tbody>
    </table>
  </section>

  <!-- tabs -->
  <section class="card">
    <div class="tabs">
      <button class="tab on" data-tab="log">来訪ログ</button>
      <button class="tab" data-tab="trend">推移</button>
      <button class="tab" data-tab="data">データ</button>
    </div>

    <div class="panel on" id="p-log">
      <div class="toolbar"><input type="date" id="logDate"><span id="logSummary" class="muted" style="font-size:13px"></span></div>
      <table>
        <thead><tr><th>時刻</th><th>区分</th><th>国籍</th><th class="n">人数</th><th></th></tr></thead>
        <tbody id="logBody"></tbody>
      </table>
    </div>

    <div class="panel" id="p-trend">
      <div class="toolbar">
        <select id="trendRange"><option value="14">直近14日</option><option value="30">直近30日</option></select>
        <select id="trendBy"><option value="bucket">回数別</option><option value="foreign">日本人／外国人</option></select>
      </div>
      <div class="bars" id="bars"></div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="panel" id="p-data">
      <p style="font-size:14px;line-height:1.8;margin-top:0">
        データはこの端末のブラウザ内にだけ保存され、外部には送信されません。<br>
        機種変更やブラウザのデータ消去に備えて、ときどきCSVで書き出して保管してください。
      </p>
      <div class="toolbar">
        <button class="btn-ghost" id="exportCsv">CSVで書き出す</button>
        <label class="btn-ghost" style="cursor:pointer">CSVを読み込む<input type="file" id="importCsv" accept=".csv,text/csv" hidden></label>
        <button class="btn-ghost btn-danger" id="clearAll">全データを消去</button>
      </div>
      <p class="muted" style="font-size:12px">CSV読み込みは既存データに追加されます（同じ記録は重複しません）。</p>
    </div>
  </section>
</main>

<div class="sent" id="sent"><div class="box"><div class="ck">✓</div><div class="h">送信しました</div><div class="s" id="sentS"></div><div class="n">次の記録をどうぞ</div></div></div>

<footer>北野天満宮 来訪カウンター ・ データはこの端末にのみ保存</footer>

<script>
(() => {
  const KEY = 'kitano-visitors-v2';
  const $ = id => document.getElementById(id);
  const BL = { 1: '1回目', 2: '2回目', 3: '3回目以上' };

  // data = { customers: {id:{id,name,tel,foreign}}, visits: [{id, ts, b:1|2|3, f:0|1, cid?, n?}] }
  let data = load();
  function load() {
    try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.customers && Array.isArray(d.visits)) return d; } catch (e) {}
    return { customers: {}, visits: [] };
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(data)); }
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  const norm = s => (s || '').normalize('NFKC').replace(/\s+/g, ' ').trim();
  const keyOf = (name, tel) => norm(name).replace(/ /g, '').toLowerCase() + '|' + (tel || '');
  const pad = n => String(n).padStart(2, '0');
  const dayKey = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const monthKey = ts => dayKey(ts).slice(0, 7);
  const fmtDate = ts => { const d = new Date(ts); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`; };
  const fmtTime = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const WD = ['日', '月', '火', '水', '木', '金', '土'];
  const todayKey = () => dayKey(Date.now());

  const findCustomer = (name, tel) => { const k = keyOf(name, tel); return Object.values(data.customers).find(c => keyOf(c.name, c.tel) === k); };
  const visitsOf = cid => data.visits.filter(v => v.cid === cid).sort((a, b) => a.ts - b.ts);
  // recompute n / bucket for a named customer's visits (keeps them consistent after edits)
  function renumber(cid) {
    const c = data.customers[cid];
    visitsOf(cid).forEach((v, i) => { v.n = i + 1; v.b = Math.min(3, i + 1); if (c) v.f = c.foreign ? 1 : 0; });
  }

  // ---------- live counter ----------
  const history = []; // visit ids added this session, for undo
  const Q = v => v.q || 1;
  // draft: pending taps for the current group, committed with 送信
  let draft = {}; // "f-b" -> people
  const draftTotal = () => Object.values(draft).reduce((a, x) => a + x, 0);
  const draftText = () => Object.entries(draft).map(([k, n]) => { const [f, b] = k.split('-'); return `${+f ? '外国人' : '日本人'}${BL[b]}×${n}`; }).join('、');
  function renderDraft() {
    document.querySelectorAll('.cbtn').forEach(btn => {
      const n = draft[btn.dataset.f + '-' + btn.dataset.b] || 0;
      btn.classList.toggle('pending', n > 0);
      btn.querySelector('.p').textContent = n ? '+' + n : '';
    });
    const tot = draftTotal();
    $('sendBtn').disabled = !tot;
    $('sendBtn').textContent = tot ? `送信（${tot}名）` : '区分をタップしてください';
    $('draftLabel').textContent = tot ? draftText() : '';
  }
  function tap(f, b) {
    const k = f + '-' + b;
    draft[k] = (draft[k] || 0) + 1;
    renderDraft();
  }
  document.querySelectorAll('.cbtn').forEach(btn => btn.addEventListener('click', () => {
    tap(+btn.dataset.f, +btn.dataset.b);
    btn.classList.add('flash'); setTimeout(() => btn.classList.remove('flash'), 150);
    try { navigator.vibrate && navigator.vibrate(15); } catch (e) {}
  }));
  $('clearBtn').addEventListener('click', () => { draft = {}; renderDraft(); });

  const groupsToday = () => new Set(data.visits.filter(v => dayKey(v.ts) === todayKey()).map(v => v.g || v.id)).size;
  let sentTimer;
  $('sendBtn').addEventListener('click', () => {
    const tot = draftTotal(); if (!tot) return;
    const g = uid(), ts = Date.now(), text = draftText();
    for (const [k, n] of Object.entries(draft)) {
      const [f, b] = k.split('-').map(Number);
      const v = { id: uid(), ts, b, f, g };
      if (n > 1) v.q = n;
      data.visits.push(v);
    }
    history.push(g); save();
    draft = {}; renderDraft(); render();
    const no = groupsToday();
    $('sentS').textContent = `本日 第${no}組 ・ ${tot}名`;
    $('lastLabel').textContent = `${fmtTime(ts)} 第${no}組：${text}`;
    const el = $('sent'); el.classList.add('show');
    clearTimeout(sentTimer); sentTimer = setTimeout(() => el.classList.remove('show'), 1100);
    try { navigator.vibrate && navigator.vibrate([20, 40, 20]); } catch (e) {}
  });

  function removeVisit(id) {
    const v = data.visits.find(x => x.id === id); if (!v) return;
    data.visits = data.visits.filter(x => x.id !== id);
    if (v.cid) {
      if (!data.visits.some(x => x.cid === v.cid)) delete data.customers[v.cid];
      else renumber(v.cid);
    }
    save(); render();
  }

  // ---------- tabs ----------
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'p-' + t.dataset.tab));
  }));
  let sumMode = 'today';
  $('sumSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    sumMode = b.dataset.v; [...$('sumSeg').children].forEach(x => x.classList.toggle('on', x === b)); renderSummary();
  });
  $('logDate').value = todayKey();
  $('logDate').addEventListener('change', renderLog);
  $('trendRange').addEventListener('change', renderTrend);
  $('trendBy').addEventListener('change', renderTrend);

  // ---------- render ----------
  function tally(list) {
    const t = { 0: { 1: 0, 2: 0, 3: 0 }, 1: { 1: 0, 2: 0, 3: 0 } };
    for (const v of list) t[v.f ? 1 : 0][v.b] += Q(v);
    return t;
  }
  const sum3 = r => r[1] + r[2] + r[3];

  function render() {
    const d = new Date();
    $('todayLabel').textContent = `${d.getMonth() + 1}月${d.getDate()}日（${WD[d.getDay()]}）`;
    const t = tally(data.visits.filter(v => dayKey(v.ts) === todayKey()));
    document.querySelectorAll('.cbtn').forEach(btn => btn.querySelector('.c').textContent = t[btn.dataset.f][btn.dataset.b]);
    $('tTotal').textContent = sum3(t[0]) + sum3(t[1]);
    $('tSplit').textContent = `日本人 ${sum3(t[0])} ／ 外国人 ${sum3(t[1])}`;
    $('groupLabel').textContent = `本日 ${groupsToday()}組`;
    renderSummary(); renderLog(); renderTrend();
  }

  function renderSummary() {
    const now = Date.now();
    const list = sumMode === 'today' ? data.visits.filter(v => dayKey(v.ts) === dayKey(now))
      : sumMode === 'month' ? data.visits.filter(v => monthKey(v.ts) === monthKey(now)) : data.visits;
    const t = tally(list);
    const tot = { 1: t[0][1] + t[1][1], 2: t[0][2] + t[1][2], 3: t[0][3] + t[1][3] };
    const row = (lbl, r, cls = '') => `<tr class="${cls}"><td>${lbl}</td><td class="n">${r[1]}</td><td class="n">${r[2]}</td><td class="n">${r[3]}</td><td class="n"><b>${sum3(r)}</b></td></tr>`;
    $('sumBody').innerHTML = row('日本人', t[0]) + row('外国人', t[1]) + row('合計', tot, 'sum');
  }

  function renderLog() {
    const k = $('logDate').value || todayKey();
    const list = data.visits.filter(v => dayKey(v.ts) === k).sort((a, b) => b.ts - a.ts);
    if (!list.length) { $('logBody').innerHTML = `<tr><td colspan="5" class="empty">この日の記録はありません</td></tr>`; $('logSummary').textContent = ''; return; }
    $('logBody').innerHTML = list.map(v => {
      return `<tr><td>${fmtTime(v.ts)}</td>
        <td><span class="badge ${v.b === 1 ? 'b1' : ''}">${BL[v.b]}</span></td>
        <td>${v.f ? '<span class="badge fg">外国人</span>' : '日本人'}</td>
        <td class="n">${Q(v)}名</td>
        <td class="n"><button class="btn-ghost btn-small btn-danger" data-del="${v.id}">削除</button></td></tr>`;
    }).join('');
    const t = tally(list);
    $('logSummary').textContent = `計 ${sum3(t[0]) + sum3(t[1])}名（日本人 ${sum3(t[0])} ／ 外国人 ${sum3(t[1])}）`;
  }
  $('logBody').addEventListener('click', e => {
    const del = e.target.closest('[data-del]');
    if (del && confirm('この記録を削除しますか？')) removeVisit(del.dataset.del);
  });

  function renderTrend() {
    const days = +$('trendRange').value, by = $('trendBy').value;
    const series = by === 'bucket'
      ? [{ k: v => v.b === 1, c: '#b08a3e', l: '1回目' }, { k: v => v.b === 2, c: '#b8325a', l: '2回目' }, { k: v => v.b === 3, c: '#7a1f2b', l: '3回目以上' }]
      : [{ k: v => !v.f, c: '#b8325a', l: '日本人' }, { k: v => !!v.f, c: '#2d4f7c', l: '外国人' }];
    const now = new Date(); now.setHours(0, 0, 0, 0);
    const buckets = [];
    for (let i = days - 1; i >= 0; i--) { const d = new Date(now); d.setDate(d.getDate() - i); buckets.push({ key: dayKey(d), d, vals: series.map(() => 0) }); }
    const idx = Object.fromEntries(buckets.map((b, i) => [b.key, i]));
    for (const v of data.visits) { const i = idx[dayKey(v.ts)]; if (i === undefined) continue; series.forEach((s, j) => { if (s.k(v)) buckets[i].vals[j] += Q(v); }); }
    const max = Math.max(1, ...buckets.map(b => b.vals.reduce((a, x) => a + x, 0)));
    $('bars').innerHTML = buckets.map(b => {
      const t = b.vals.reduce((a, x) => a + x, 0);
      const tip = series.map((s, j) => `${s.l}${b.vals[j]}`).join('・');
      return `<div class="b" title="${b.d.getMonth() + 1}/${b.d.getDate()} 計${t}（${tip}）"><span class="v">${t || ''}</span>
        <div class="col" style="height:${(t / max) * 78}%">${series.map((s, j) => `<div style="flex:${b.vals[j]};background:${s.c}"></div>`).join('')}</div>
        <span class="d">${b.d.getDate()}</span></div>`;
    }).join('');
    $('legend').innerHTML = series.map(s => `<span><i style="background:${s.c}"></i>${s.l}</span>`).join('');
  }

  // ---------- CSV ----------
  const csvCell = s => /[",\n]/.test(String(s)) ? `"${String(s).replace(/"/g, '""')}"` : String(s);
  $('exportCsv').addEventListener('click', () => {
    const rows = [['日時', '区分', '国籍', '人数']];
    for (const v of [...data.visits].sort((a, b) => a.ts - b.ts)) {
      const c = v.cid && data.customers[v.cid];
      const d = new Date(v.ts);
      rows.push([`${dayKey(v.ts)} ${fmtTime(v.ts)}:${pad(d.getSeconds())}`, BL[v.b], v.f ? '外国人' : '日本人', Q(v)]);
    }
    const csv = '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = `kitano-visitors-${todayKey()}.csv`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  function parseCsv(text) {
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
      else if (ch === '"') q = true;
      else if (ch === ',') { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += ch;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }
  const parseTs = s => Date.parse(String(s).trim().replace(/\//g, '-').replace(' ', 'T'));
  $('importCsv').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    const rows = parseCsv((await f.text()).replace(/^﻿/, '')).filter(r => r.length >= 3 && !isNaN(parseTs(r[0])));
    const seen = new Set(data.visits.map(v => `${v.ts}|${v.cid || ''}|${v.b}|${v.f}|${Q(v)}`));
    const touched = new Set(); let added = 0;
    for (const [dt, bl, nat, qs, name, tel] of rows) {
      const ts = parseTs(dt);
      const q = Math.max(1, parseInt(qs) || 1);
      const b = bl.includes('3') ? 3 : bl.includes('2') ? 2 : 1;
      const fg = nat.includes('外') ? 1 : 0;
      let cid;
      const nn = norm(name);
      if (nn) {
        const nt = norm(tel || '').replace(/\D/g, '').slice(0, 4);
        let c = findCustomer(nn, nt);
        if (!c) { c = { id: uid(), name: nn, tel: nt, foreign: !!fg }; data.customers[c.id] = c; }
        cid = c.id;
      }
      const sig = `${ts}|${cid || ''}|${b}|${fg}|${q}`;
      if (seen.has(sig) && !cid) continue;
      if (cid && data.visits.some(v => v.cid === cid && v.ts === ts)) continue;
      seen.add(sig);
      data.visits.push(cid ? { id: uid(), ts, cid, b, f: fg } : (q > 1 ? { id: uid(), ts, b, f: fg, q } : { id: uid(), ts, b, f: fg }));
      if (cid) touched.add(cid);
      added++;
    }
    touched.forEach(renumber);
    save(); render(); e.target.value = '';
    alert(`${added}件の記録を読み込みました`);
  });
  $('clearAll').addEventListener('click', () => {
    if (!confirm('全データを消去します。先にCSVで書き出すことをおすすめします。消去しますか？')) return;
    if (!confirm('本当に消去してよろしいですか？元に戻せません。')) return;
    data = { customers: {}, visits: [] }; history.length = 0; save(); render();
  });

  let shownDay = todayKey();
  setInterval(() => { if (shownDay !== todayKey()) { shownDay = todayKey(); $('logDate').value = shownDay; render(); } }, 60000);
  renderDraft();
  render();
})();
</script>
</body>
</html>
